<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.well-field{display:flex;flex-direction:column;gap:6px;margin:14px 0;font-size:13px}.well-field input,.well-field select{padding:12px;border:1px solid #ccc;border-radius:12px;width:100%;min-width:0;background:var(--cream);font:inherit}.well-photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.well-photos img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#eee;border-radius:14px}.well-photos figure{margin:0}.well-summary{display:flex;flex-direction:column;gap:8px;padding:16px;margin:20px 0;background:#edf0e5;border-radius:14px}
</style></head><body>
<title>Alivio en Cada Plato</title>
<meta name="description" content="Más de 500 recetas sin gluten y sin azúcar para desinflamar, sentirse más ligera y volver a disfrutar cada comida.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --olive:#34402A; --olive-2:#4A5638; --moss:#7C8659; --sage:#C9CDB0;
  --cream:#F6F0E4; --paper:#FFFCF5; --sand:#EADFCB; --sand-2:#DCCDB2;
  --clay:#B07A52; --gold:#B8955A; --gold-soft:#E7D6B2;
  --ink:#23261C; --ink-2:#4B4B3E; --muted:#7A7663; --line:#E3D8C3;
  --ok:#5F7C3E; --warn:#B0663A;
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --sans:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --shadow:0 10px 30px -12px rgba(52,64,42,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#2C3523;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1200px 600px at 20% 10%,#3D4A30 0,transparent 60%),radial-gradient(900px 700px at 90% 90%,#46382A 0,transparent 55%);pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}

#app{position:relative;max-width:440px;height:100%;margin:0 auto;background:var(--cream);overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
@media (min-width:600px){ #app{height:calc(100% - 40px);margin:20px auto;border-radius:38px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6),0 0 0 10px #1E2418,0 0 0 11px #4A5638} }
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:110px;scroll-behavior:smooth}
.pad{padding-inline:20px}

/* ---------- barra inferior ---------- */
#tabbar{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:70px;background:var(--olive);border-radius:24px;display:grid;grid-template-columns:repeat(6,1fr);align-items:center;box-shadow:0 18px 40px -16px rgba(20,26,14,.7);z-index:20}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#B9BE9E;font-size:10.5px;letter-spacing:.02em;height:100%;justify-content:center;transition:color .2s}
#tabbar button svg{width:22px;height:22px}
#tabbar button.on{color:#F6F0E4}
#tabbar button.on .dot{opacity:1}
#tabbar .dot{width:4px;height:4px;border-radius:2px;background:var(--gold);opacity:0;margin-top:1px}
#tabbar .mid{position:relative}
#tabbar .mid .fab{width:52px;height:52px;border-radius:18px;background:var(--gold);color:var(--olive);display:grid;place-items:center;margin-top:-26px;box-shadow:0 10px 20px -8px rgba(0,0,0,.5);border:4px solid var(--cream)}
#tabbar .mid.on .fab{background:#D8B679}
#tabbar .mid span.l{margin-top:2px}

/* ---------- tipografia ---------- */
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.display{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.02}
.h1{font-family:var(--serif);font-size:36px;font-weight:600;line-height:1.02;letter-spacing:-.01em}
.h2{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.h3{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.15}
.it{font-style:italic;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- topo ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px;gap:12px}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);position:relative;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn .n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--clay);color:#fff;font-size:10.5px;display:grid;place-items:center;font-weight:600}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;flex:none}
.wordmark{line-height:1}
.wordmark b{font-family:var(--serif);font-size:20px;font-weight:600;font-style:italic;color:var(--olive);display:block}
.wordmark span{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}

.search{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:50px}
.search svg{width:19px;height:19px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;height:100%}
.search input::placeholder{color:#A39E88}
.search .fbtn{width:36px;height:36px;border-radius:11px;background:var(--olive);color:var(--cream);display:grid;place-items:center;position:relative;flex:none}
.search .fbtn svg{color:var(--cream);width:17px;height:17px}
.search .fbtn .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--olive);font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}

/* ---------- hero ---------- */
.hero{position:relative;margin:14px 20px 0;border-radius:var(--r-lg);overflow:hidden;min-height:250px;color:#FBF6EA;box-shadow:var(--shadow)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(40,50,30,.92) 0%,rgba(40,50,30,.72) 45%,rgba(40,50,30,.05) 80%)}
.hero .in{position:relative;z-index:1;padding:24px 20px;display:flex;flex-direction:column;gap:10px;max-width:78%;min-height:250px;justify-content:flex-end}
.hero .h1{font-size:31px}
.hero .btn{white-space:nowrap}
.hero p{font-size:13.5px;color:#E5E0CE}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:16px;font-weight:500;letter-spacing:.01em;transition:transform .15s,background .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.gold{background:var(--gold);color:#23261C}
.btn.olive{background:var(--olive);color:var(--cream)}
.btn.ghost{background:transparent;border:1.5px solid var(--olive);color:var(--olive)}
.btn.soft{background:var(--sand);color:var(--olive)}
.btn.block{width:100%}
.btn.sm{height:40px;padding:0 16px;border-radius:13px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.linkbtn{color:var(--olive);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.linkbtn svg{width:16px;height:16px}

/* ---------- secções / carrossel ---------- */
.sec{margin-top:30px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px;margin-bottom:14px;gap:12px}
.sechead .h2{font-size:24px}
.sechead p{font-size:13px;color:var(--muted);margin-top:2px}
.rail{display:flex;gap:14px;overflow-x:auto;padding:4px 20px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail > *{scroll-snap-align:start;flex:none}

.rc{width:196px;cursor:pointer;position:relative}
.rc .ph{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/4.3;background:var(--sand);box-shadow:0 8px 20px -14px rgba(40,50,30,.6)}
.rc .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.rc:hover .ph img{transform:scale(1.04)}
.rc h4{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.12;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12px;color:var(--muted);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:13px;height:13px}
.fav{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:12px;background:rgba(255,252,245,.92);display:grid;place-items:center;color:var(--olive);backdrop-filter:blur(6px);transition:transform .2s}
.fav svg{width:18px;height:18px}
.fav.on{color:#C0563A}
.fav.on svg path{fill:currentColor}
.fav.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.chiptag{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:9px;background:rgba(35,38,28,.72);color:#F6F0E4;font-size:11px;backdrop-filter:blur(4px)}
.chiptag svg{width:12px;height:12px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:0 20px}
.grid2 .rc{width:auto}
.grid2 .rc h4{font-size:17px}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 20px 6px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:13.5px;color:var(--ink-2);transition:all .15s;white-space:nowrap}
.chip svg{width:15px;height:15px}
.chip .c{font-size:11px;color:var(--muted)}
.chip.on{background:var(--olive);color:var(--cream);border-color:var(--olive)}
.chip.on .c{color:#C9CDB0}
.chip.warn{border-color:#E1B89A;background:#FBEDE2;color:#8A4A26}
.chip .x{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;margin-right:-6px;opacity:.8}
.chip .x svg{width:12px;height:12px}
.tag{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:9px;background:var(--sand);color:var(--olive);font-size:12px;font-weight:500}
.tag.gold{background:var(--gold-soft);color:#6D5427}
.tag svg{width:13px;height:13px}

/* ---------- cartões ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md)}
.daily{margin:22px 20px 0;display:flex;gap:14px;align-items:center;padding:12px;cursor:pointer}
.daily img{width:84px;height:84px;border-radius:14px;object-fit:cover;flex:none}
.daily .h3{font-size:19px;margin-top:2px}
.quote{margin:30px 20px 0;padding:24px 22px;border-radius:var(--r-lg);background:var(--sand);position:relative;overflow:hidden}
.quote .display{font-size:27px;color:var(--olive);font-style:italic;font-weight:500;max-width:88%}
.quote svg.leafdeco{position:absolute;right:-16px;bottom:-18px;width:120px;height:120px;color:var(--sand-2)}

.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 20px}
.cat{position:relative;border-radius:16px;overflow:hidden;height:92px;cursor:pointer;color:#FBF6EA;text-align:left}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,40,25,.85),rgba(35,40,25,.25))}
.cat span{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding:12px 14px;font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.05}
.cat small{font-family:var(--sans);font-size:11.5px;font-weight:400;opacity:.8;margin-top:3px}

/* premium */
.premium{margin:30px 20px 0;border-radius:var(--r-lg);background:var(--olive);color:var(--cream);padding:22px;position:relative;overflow:hidden}
.premium::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(184,149,90,.35);box-shadow:0 0 0 22px rgba(184,149,90,.07),0 0 0 44px rgba(184,149,90,.05)}
.premium .eyebrow{color:var(--gold)}
.premium .h2{margin:6px 0 6px;color:#FBF6EA}
.premium p{color:#CFD2B8;font-size:13.5px}
.plocks{display:grid;gap:8px;margin:16px 0}
.plock{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.plock .ic{width:34px;height:34px;border-radius:10px;background:rgba(184,149,90,.18);color:var(--gold);display:grid;place-items:center;flex:none}
.plock .ic svg{width:17px;height:17px}
.plock b{font-weight:500;font-size:14px;display:block}
.plock small{color:#AEB294;font-size:12px}
.plock .lk{margin-left:auto;color:var(--gold)}
.plock .lk svg{width:16px;height:16px}

/* ---------- overlay / páginas ---------- */
#overlays{position:absolute;inset:0;pointer-events:none;z-index:30}
.page{position:absolute;inset:0;background:var(--cream);overflow-y:auto;overflow-x:hidden;pointer-events:auto;animation:slidein .32s cubic-bezier(.2,.8,.2,1);padding-bottom:40px}
.page.out{animation:slideout .25s forwards}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideout{to{transform:translateX(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.page,.page.out,.sheet,.toast,.banner{animation:none!important}#view{scroll-behavior:auto}}
.pagehead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(246,240,228,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.pagehead .h3{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* detalhe da receita */
.dhero{position:relative;height:330px}
.dhero img{width:100%;height:100%;object-fit:cover}
.dhero .bar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between}
.dhero .bar .iconbtn{background:rgba(255,252,245,.9);backdrop-filter:blur(6px);border:0}
.dhero .bar .iconbtn.on{color:#C0563A}
.dhero .bar .iconbtn.on svg path{fill:currentColor}
.dhero .pcredit{position:absolute;right:12px;bottom:44px;max-width:70%;padding:3px 8px;border-radius:999px;background:rgba(20,20,19,.5);color:#fff;font-size:10px;line-height:1.4;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(4px);pointer-events:none}
.dbody{position:relative;margin-top:-34px;background:var(--cream);border-radius:30px 30px 0 0;padding:26px 20px 10px}
.dbody .h1{font-size:33px;margin-top:6px}
.rating{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:8px}
.rating svg{width:15px;height:15px;color:var(--gold)}
.rating svg path{fill:currentColor}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:20px 0 4px;background:var(--paper);border:1px solid var(--line);border-radius:18px}
.stats > div{padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.stats > div + div{border-left:1px solid var(--line)}
.stats svg{width:18px;height:18px;color:var(--moss)}
.stats b{font-size:14px;font-weight:600}
.stats small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:22px;height:22px;border-radius:7px;background:var(--sand);display:grid;place-items:center;color:var(--olive)}
.stepper button svg{width:12px;height:12px;color:var(--olive)}
.dsec{margin-top:28px}
.dsec .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px}
.ing{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.ing:last-child{border-bottom:0}
.box{width:24px;height:24px;border-radius:8px;border:1.6px solid var(--sage);display:grid;place-items:center;flex:none;transition:all .15s;background:var(--paper)}
.box svg{width:14px;height:14px;color:#fff;opacity:0}
.on > .box,.box.on{background:var(--moss);border-color:var(--moss)}
.on > .box svg,.box.on svg{opacity:1}
.ing .nm{flex:1;min-width:0}
.ing.on .nm{color:var(--muted);text-decoration:line-through}
.ing .q{font-size:13px;color:var(--olive);font-weight:500;white-space:nowrap}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:flex;gap:14px;padding:16px;border-radius:16px;background:var(--paper);border:1px solid var(--line);cursor:pointer;transition:opacity .2s}
.step .num{width:30px;height:30px;border-radius:10px;background:var(--sand);color:var(--olive);display:grid;place-items:center;font-family:var(--serif);font-size:18px;font-weight:600;flex:none}
.step.on{opacity:.55}
.step.on .num{background:var(--moss);color:#fff}
.nut{display:grid;gap:12px;padding:18px;border-radius:18px;background:var(--paper);border:1px solid var(--line)}
.nut .kc{display:flex;align-items:baseline;gap:8px}
.nut .kc b{font-family:var(--serif);font-size:38px;font-weight:600;color:var(--olive);line-height:1}
.nrow{display:grid;grid-template-columns:92px 1fr 48px;align-items:center;gap:10px;font-size:13px}
.nrow .tr{height:8px;border-radius:4px;background:var(--sand);overflow:hidden}
.nrow .tr i{display:block;height:100%;border-radius:4px}
.nrow .v{text-align:right;font-weight:500}
.actions{display:grid;gap:10px;margin-top:22px}
.actions .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* criar */
.createhead{padding:22px 20px 0}
.createhead .h1{font-size:38px;color:var(--olive)}
.inrow{display:flex;gap:8px;position:relative}
.inrow .search{flex:1}
.addbtn{width:50px;height:50px;border-radius:16px;background:var(--olive);color:var(--cream);display:grid;place-items:center;flex:none}
.addbtn svg{width:20px;height:20px}
.sugg{position:absolute;left:0;right:58px;top:56px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:6;overflow:hidden;max-height:260px;overflow-y:auto}
.sugg button{display:flex;width:100%;text-align:left;padding:12px 16px;gap:10px;align-items:center;border-bottom:1px solid var(--line);font-size:14px}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button.hl{background:var(--sand)}
.sugg .sw{width:14px;height:14px;border-radius:5px;flex:none}
.sugg small{margin-left:auto;color:var(--muted);font-size:11.5px}
.fieldlabel{font-weight:500;font-size:14px;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fieldlabel small{font-weight:400;color:var(--muted);font-size:12.5px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{height:40px;border-radius:10px;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--olive);color:var(--cream)}
.loading{display:flex;flex-direction:column;align-items:center;gap:18px;padding:80px 20px;text-align:center}
.loading .pot{width:90px;height:90px;border-radius:50%;background:var(--sand);display:grid;place-items:center;position:relative}
.loading .pot svg{width:44px;height:44px;color:var(--olive);animation:bob 1s ease-in-out infinite}

/* ============ RNG ============ */
function rngFrom(seed) {
  let a = typeof seed === 'number' ? seed : hashStr(seed);
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(arr, r) { return arr[Math.floor(r() * arr.length)]; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  else if (t === 'plate' || t === 'stack' || (t === 'flat' && art.kind !== 'wraps' && art.kind !== 'tacos') || t === 'pasta') {

    } else if (t === 'stack') {

    art.garnish.forEach(k => food += fillArea(R, k, cx + 10, cy - 10, 0, 34, 0, 6.29, .5));
    body = `<g ${shadow}><circle cx="${cx}" cy="${cy}" r="${Ro}" fill="${cer}"/></g><circle cx="${cx}" cy="${cy}" r="${Ro - 4}" fill="none" stroke="${shade(cer, -.08)}" stroke-width="3"/>${food}`;

  else if (t === 'glass') {
    const v = art.v, cx = v === 'mug' ? 185 : 200, cy = 150;
    if (v === 'mug') {
      body += `<g ${shadow}><rect x="${cx + 70}" y="${cy - 22}" width="56" height="44" rx="22" fill="none" stroke="${cer}" stroke-width="16"/><circle cx="${cx}" cy="${cy}" r="92" fill="${cer}"/></g><circle cx="${cx}" cy="${cy}" r="78" fill="${art.col}"/><circle cx="${cx}" cy="${cy}" r="78" fill="url(#${uid}in)"/><circle cx="${cx}" cy="${cy}" r="62" fill="${shade(art.col, .3)}" opacity=".6"/><path d="M${cx},${cy + 26} C${cx - 40},${cy - 4} ${cx - 22},${cy - 38} ${cx},${cy - 16} C${cx + 22},${cy - 38} ${cx + 40},${cy - 4} ${cx},${cy + 26}Z" fill="${shade(art.col, .6)}" opacity=".85"/>`;
      body += `<g transform="translate(92,240) rotate(-30)"><rect x="-50" y="-7" width="100" height="14" rx="7" fill="#8A4F2A"/><rect x="-50" y="-2" width="100" height="3" fill="#6B3A1E"/></g>`;
    } else if (v === 'water') {
      body += `<g ${shadow}><circle cx="${cx}" cy="${cy}" r="112" fill="#F4F8F4" opacity=".55"/></g><circle cx="${cx}" cy="${cy}" r="112" fill="none" stroke="#FFFFFF" stroke-width="6" opacity=".9"/><circle cx="${cx}" cy="${cy}" r="100" fill="${art.col}" opacity=".85"/>`;
      body += scatterPolar(R, cx, cy, 0, 80, 0, 6.29, 7, (x, y) => `<rect x="${f1(x - 14)}" y="${f1(y - 14)}" width="28" height="28" rx="6" fill="#fff" opacity=".45" transform="rotate(${Math.round(R() * 90)} ${f1(x)} ${f1(y)})"/>`);
      art.top.forEach(k => body += fillArea(R, k, cx, cy, 0, 88, 0, 6.29, ING[k].pat === 'slice' ? .35 : .5));
    } else {
      const Ro = v === 'jar' ? 96 : v === 'cup' ? 84 : 90;
      const liquid = v === 'jar' ? `<circle cx="${cx}" cy="${cy}" r="${Ro - 12}" fill="${art.col}"/>` + scatterPolar(R, cx, cy, 0, Ro - 16, 0, 6.29, 60, (x, y) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(1.5 + R() * 3)}" fill="${shade(art.col, (R() - .5) * .3)}"/>`) : `<circle cx="${cx}" cy="${cy}" r="${Ro - 10}" fill="${art.col}"/><circle cx="${cx}" cy="${cy}" r="${Ro - 22}" fill="${shade(art.col, .12)}"/>`;
      body += `<g ${shadow}><circle cx="${cx}" cy="${cy}" r="${Ro}" fill="#FFFFFF" opacity=".6"/></g><circle cx="${cx}" cy="${cy}" r="${Ro}" fill="none" stroke="#fff" stroke-width="7" opacity=".85"/>${v === 'jar' ? `<circle cx="${cx}" cy="${cy}" r="${Ro - 4}" fill="none" stroke="#D9CFBE" stroke-width="3"/>` : ''}${liquid}<circle cx="${cx}" cy="${cy}" r="${Ro - 10}" fill="url(#${uid}in)"/>`;

function photoSlot(r) { return PHOTOS[r.id] || null; }
function photoFor(r) { const f = photoSlot(r); return f ? 'photos/' + f + '.jpg' : null; }
function photoCredit(r) {
  const f = photoSlot(r), c = f && PHOTO_CREDITS[f];
  return c ? `<span class="pcredit">Foto: ${esc(c[0])} · ${esc(c[1])}</span>` : '';
}
function img(r, cls = '') {
  const p = photoFor(r), svg = dishURL(r.art, r.id);
  return `<img ${cls ? `class="${cls}"` : ''} src="${p || svg}" alt="${esc(r.name)}" loading="lazy"${p ? ` onerror="this.onerror=null;this.src='${svg}'"` : ''}>`;
}
function isFav(id) { return !!st.favs[id]; }
function card(r) {
  return `<article class="rc" data-a="open" data-id="${r.id}" tabindex="0" aria-label="${esc(r.name)}">
    <div class="ph">${img(r)}<button class="fav ${isFav(r.id) ? 'on' : ''}" data-a="fav" data-id="${r.id}" aria-label="Favorito">${ic('heart')}</button>

}
function rail(list) { return `<div class="rail">${list.map(card).join('')}</div>`; }
function section(title, sub, list, more) {
  return `<section class="sec"><div class="sechead"><div><h2 class="h2">${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${more ? `<button class="linkbtn" ${more}>Ver todas ${ic('chev')}</button>` : ''}</div>${rail(list)}</section>`;
}
function greet() { const h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches'; }
function dayHash() { const d = new Date(); return d.getFullYear() * 400 + d.getMonth() * 32 + d.getDate(); }
function passesRestr(r, restr = st.restr) {
  return restr.every(x => x === 'Sin lactosa' ? r.tags.includes('semLactose') : x === 'Vegetariana' ? r.tags.includes('vegetariana') : x === 'Vegana' ? r.tags.includes('vegana') : x === 'Bajo en calorías' ? r.tags.includes('baixaCaloria') : true);
}
function forYou() {
  const R = rngFrom(hashStr(dayHash() + st.goals.join() + st.prefs.join()));
  return RECIPES.filter(r => passesRestr(r)).map(r => {
    let s = r.pop / 20 + R() * 3;
    if (st.goals.includes('Recetas rápidas') && r.time <= 20) s += 3;
    if (st.goals.includes('Reducir el azúcar') && (r.cat === 'sobremesas' || r.cat === 'bebidas')) s += 2;
    if ((st.goals.includes('Desinflamar') || st.goals.includes('Deshinchar')) && r.keys.some(k => ['curcuma', 'gengibre', 'couve', 'espinafres', 'salmao', 'mirtilo', 'chia', 'linhaca'].includes(k))) s += 2.5;
    if (st.goals.includes('Más energía') && r.tags.includes('proteica')) s += 2;
    if (st.goals.includes('Comer más sano') && r.nut.fb >= 6) s += 1.5;
    if ((st.goals.includes('Adelgazar con calma') || (cloud.profile?.target_loss > 0)) && r.kcal <= 350) s += 2;
    if (st.prefs.includes('Pescado') && r.keys.some(k => ING[k].t === 'fish')) s += 2;
    if (st.prefs.includes('Carne blanca') && r.keys.some(k => ['frango', 'peru', 'coxas'].includes(k))) s += 2;
    if (st.prefs.includes('Sopas') && r.art.t === 'soup') s += 2;
    if (st.prefs.includes('Smoothies') && r.cat === 'bebidas') s += 2;
    if (st.prefs.includes('Platos al horno') && /horno|Bandeja|Pastel de|Lasaña/.test(r.name)) s += 2;
    if (st.prefs.includes('Dulces sin azúcar') && r.cat === 'sobremesas') s += 2;
    if (st.prefs.includes('Verduras de temporada') && r.keys.some(k => ['abobora', 'batata_doce', 'cogumelos', 'couve'].includes(k))) s += 1.5;
    return [s, r];
  }).sort((a, b) => b[0] - a[0]).map(x => x[1]);
}
function dailyPick() { const l = forYou().slice(0, 30); return l[dayHash() % l.length]; }

function setTab(t) {
  ui.tab = t; closeAllPages();
  document.querySelectorAll('#tabbar button').forEach(b => { b.classList.toggle('on', b.dataset.tab === t); b.setAttribute('aria-current', b.dataset.tab === t ? 'page' : 'false'); });
  render(); $('#view').scrollTop = 0;
}
function render() {
  const v = $('#view');
  v.innerHTML = ({ inicio: vHome, receitas: vRecipes, criar: vCreate, favoritos: vFavs, perfil: vProfile, premium: vPremium })[ui.tab]();
  if (ui.tab === 'receitas' && ui.focusSearch) { ui.focusSearch = false; setTimeout(() => $('#rq') && $('#rq').focus(), 50); }
}
function pushPage(html, key) {
  const p = document.createElement('div'); p.className = 'page'; p.dataset.key = key || '';
  p.innerHTML = html; $('#overlays').appendChild(p); ui.stack.push(p); return p;
}
function popPage() {
  const p = ui.stack.pop(); if (!p) return;
  p.classList.add('out'); setTimeout(() => p.remove(), 240);
  if (!ui.stack.length) render();
}
function closeAllPages() { ui.stack.forEach(p => p.remove()); ui.stack = []; }
function refreshTopPage() { const p = ui.stack[ui.stack.length - 1]; if (!p) return render(); const k = p.dataset.key; const y = p.scrollTop; const [type, id] = k.split(':'); const html = type === 'recipe' ? pRecipe(getR(id)) : type === 'shop' ? pShop() : type === 'hist' ? pHistory() : type === 'coll' ? pColl(id) : null; if (html) { p.innerHTML = html; p.scrollTop = y; } }

function filterRecipes() {
  const f = ui.rx, q = norm(f.q.trim());
  return RECIPES.filter(r => {
    if (f.cat !== 'all' && !r.cats.includes(f.cat)) return false;
    if (q && !q.split(/\s+/).every(w => r.search.includes(w))) return false;
    if (f.time && r.time > f.time) return false;
    if (f.diff.length && !f.diff.includes(r.diff)) return false;
    if (f.ings.length && !f.ings.every(k => r.keys.includes(k) || (k === 'ovo' && r.keys.includes('ovo')))) return false;
    if (f.diet.length && !f.diet.every(t => r.tags.includes(t))) return false;
    return true;
  });
}

    const key = it.key || 'x:' + norm(it.name);
    const ex = st.shop.find(s => s.key === key);
    if (ex) {
      const a = String(ex.qty).match(/^([\d.,½]+)\s*(.*)$/), b = String(it.qty).match(/^([\d.,½]+)\s*(.*)$/);

      else if (!ex.from.includes(r.name)) ex.qty = ex.qty + ' + ' + it.qty;

function suggestFor(q) {
  const n = norm(q.trim()); if (!n) return [];
  const all = Object.values(ING).filter(g => !['eritritol', 'fermento', 'caldo'].includes(g.k));
  return all.map(g => { const a = norm(g.s), b = norm(g.n); const sc = a.startsWith(n) ? 0 : b.startsWith(n) ? 1 : a.includes(n) ? 2 : b.includes(n) ? 3 : 9; return [sc, g]; }).filter(x => x[0] < 9 && !cr.tags.some(t => t.key === x[1].k)).sort((a, b) => a[0] - b[0] || a[1].s.length - b[1].s.length).slice(0, 6).map(x => x[1]);
}

}
function crAddFromInput() {

  const s = suggestFor(v)[0];
  if (s && (norm(s.s).startsWith(norm(v)) || norm(s.n).includes(norm(v)))) cr.tags.push({ key: s.k, name: s.s });
  else if (!cr.tags.some(t => norm(t.name) === norm(v))) cr.tags.push({ key: null, name: v });
  if (cr.example) { cr.example = false; }
  cr.q = ''; render(); setTimeout(() => $('#crq') && $('#crq').focus(), 0);
}

const ADJ = ['de la Huerta', 'del Jardín', 'de Temporada', 'Reconfortante', 'Tierra y Hoja', 'de Domingo', 'Sol de la Mañana', 'Verde Ligero', 'de la Casa', 'Mesa Serena'];
function generate() {
  const restr = cr.restr, T = cr.time || 999, vr = cr.variant;
  const R = rngFrom(cr.tags.map(t => t.name).join() + restr.join() + vr);

/* ============ EVENTOS ============ */
function toggleIn(arr, v) { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
function onClick(e) {
  const t = e.target.closest('[data-a]'); if (!t) { if (!e.target.closest('.inrow')) { const s = $('#sugg'); if (s) s.hidden = true; } return; }
  const a = t.dataset.a, id = t.dataset.id;
  switch (a) {
    case 'tab': closeSheet(); setTab(t.dataset.tab); break;
    case 'open': e.stopPropagation(); document.querySelectorAll('.banner').forEach(b => b.remove()); closeSheet(); openRecipe(id); break;
    case 'fav': {
      e.stopPropagation();
      if (st.favs[id]) { delete st.favs[id]; st.colls.forEach(c => c.items = c.items.filter(x => x !== id)); toast('Quitada de favoritos', 'heart'); }
      else { st.favs[id] = 1; toast('Guardada en favoritos', 'heart'); }
      save();
      document.querySelectorAll(`[data-a="fav"][data-id="${id}"]`).forEach(b => { b.classList.toggle('on', !!st.favs[id]); b.classList.add('pop'); setTimeout(() => b.classList.remove('pop'), 400); });
      if (ui.tab === 'favoritos' && !ui.stack.length) render();
      if (ui.stack.length) refreshTopPage();
      break;
    }
    case 'back': popPage(); break;
    case 'gosearch': ui.rx = { cat: 'all', q: '', time: 0, diff: [], ings: [], diet: [], page: 1 }; ui.focusSearch = true; setTab('receitas'); break;
    case 'gocat': ui.rx = { cat: t.dataset.cat, q: '', time: 0, diff: [], ings: [], diet: [], page: 1 }; setTab('receitas'); break;
    case 'cat': ui.rx.cat = t.dataset.cat; ui.rx.page = 1; render(); break;
    case 'more': ui.rx.page++; { const y = $('#view').scrollTop; render(); $('#view').scrollTop = y; } break;
    case 'filters': e.preventDefault(); sheetFilters(); break;
    case 'ft': ui.rx.time = +t.dataset.v; refreshSheet(); break;
    case 'fd': toggleIn(ui.rx.diff, t.dataset.v); refreshSheet(); break;
    case 'fdi': toggleIn(ui.rx.diet, t.dataset.v); refreshSheet(); break;
    case 'fi': toggleIn(ui.rx.ings, t.dataset.v); refreshSheet(); break;
    case 'fclear': Object.assign(ui.rx, { time: 0, diff: [], ings: [], diet: [] }); refreshSheet(); break;
    case 'rmf': { const k = t.dataset.k, v = t.dataset.v; if (k === 'time') ui.rx.time = 0; else ui.rx[k] = ui.rx[k].filter(x => x !== v); render(); break; }
    case 'clearf': Object.assign(ui.rx, { time: 0, diff: [], ings: [], diet: [], page: 1 }); render(); break;
    case 'clearall': ui.rx = { cat: 'all', q: '', time: 0, diff: [], ings: [], diet: [], page: 1 }; render(); break;
    case 'closesheet': closeSheet(); break;
    case 'serv': {
      const cre = t.dataset.cr; const r = cre ? cr.result : getR(ui.stack[ui.stack.length - 1].dataset.key.split(':')[1]);
      const d = detail[r.id]; d.serv = Math.max(1, Math.min(12, d.serv + +t.dataset.d));
      if (cre) { const y = $('#view').scrollTop; render(); $('#view').scrollTop = y; } else refreshTopPage();
      break;
    }
    case 'got': { const r = getR(ui.stack[ui.stack.length - 1].dataset.key.split(':')[1]); const d = detail[r.id]; d.got[t.dataset.i] = !d.got[t.dataset.i]; refreshTopPage(); break; }
    case 'step': { const r = getR(ui.stack[ui.stack.length - 1].dataset.key.split(':')[1]); const d = detail[r.id]; d.done[t.dataset.i] = !d.done[t.dataset.i]; refreshTopPage(); break; }
    case 'addshop': { const r = getR(id); addToShop(r, detail[id].serv); break; }
    case 'savesheet': sheetSave(id); break;
    case 'togglecoll': { const c = st.colls.find(x => x.id === t.dataset.c); toggleIn(c.items, id); save(); refreshSheet(); break; }
    case 'cooked': st.cooked[id] = (st.cooked[id] || 0) + 1; save(); toast(st.cooked[id] === 1 ? '¡Qué rico! Registramos su receta.' : `Ya preparó esta receta ${st.cooked[id]} veces.`, 'sparkle'); refreshTopPage(); break;
    case 'shop': closeSheet(); pushPage(pShop(), 'shop:'); break;
    case 'shoptoggle': st.shop[t.dataset.i].done = !st.shop[t.dataset.i].done; save(); refreshTopPage(); break;
    case 'shopdone': st.shop = st.shop.filter(i => !i.done); save(); refreshTopPage(); toast('Artículos comprados eliminados'); break;
    case 'shopclear': st.shop = []; save(); refreshTopPage(); break;
    case 'hist': pushPage(pHistory(), 'hist:'); break;
    case 'histclear': st.history = []; save(); refreshTopPage(); break;
    case 'coll': pushPage(pColl(t.dataset.c), 'coll:' + t.dataset.c); break;
    case 'newcoll': sheetNewColl(); break;
    case 'ncfill': $('#ncname').value = t.dataset.v; break;
    case 'delcoll': ui.confirmDel = t.dataset.c; refreshTopPage(); break;
    case 'delcollno': ui.confirmDel = null; refreshTopPage(); break;
    case 'delcollyes': st.colls = st.colls.filter(c => c.id !== t.dataset.c); ui.confirmDel = null; save(); popPage(); toast('Colección eliminada', 'trash'); break;
    case 'rmfromcoll': e.stopPropagation(); { const c = st.colls.find(x => x.id === t.dataset.c); c.items = c.items.filter(x => x !== id); save(); refreshTopPage(); toast('Quitada de la colección'); } break;
    case 'delcreated': e.stopPropagation(); st.created = st.created.filter(x => x.id !== id); delete st.favs[id]; save(); refreshTopPage(); toast('Receta creada eliminada', 'trash'); break;
    case 'unfav': e.stopPropagation(); delete st.favs[id]; st.colls.forEach(c => c.items = c.items.filter(x => x !== id)); save(); render(); toast('Quitada de favoritos', 'heart'); break;
    // criar
    case 'cradd': e.preventDefault(); { const k = t.dataset.k; if (cr.example) { cr.tags = []; } if (!cr.tags.some(x => x.key === k)) cr.tags.push({ key: k, name: ING[k].s }); cr.example = false; cr.q = ''; render(); } break;
    case 'crrm': cr.tags.splice(+t.dataset.i, 1); cr.example = false; render(); break;
    case 'crrestr': toggleIn(cr.restr, t.dataset.v); if (t.dataset.v === 'Vegana' && cr.restr.includes('Vegana') && !cr.restr.includes('Vegetariana')) cr.restr.push('Vegetariana'); render(); break;
    case 'crtime': cr.time = +t.dataset.v; render(); break;
    case 'crgo': cr.variant = 0; runCreate(); break;
    case 'cragain': cr.variant++; runCreate(); break;
    case 'credit': cr.result = null; render(); $('#view').scrollTop = 0; break;
    case 'crsave': { const r = cr.result; if (!st.created.some(c => c.id === r.id)) { st.created.unshift(JSON.parse(JSON.stringify(r))); st.favs[r.id] = 1; save(); toast('Guardada en “Mis creaciones”', 'bookmark'); const y = $('#view').scrollTop; render(); $('#view').scrollTop = y; } break; }
    case 'crshop': addToShop(cr.result, detail[cr.result.id].serv); break;
    // perfil
    case 'pg': toggleIn(st[t.dataset.k], t.dataset.v); if (t.dataset.k === 'restr') cr.restr = null; save(); { const y = $('#view').scrollTop; render(); $('#view').scrollTop = y; } break;
    case 'notif': st.notif = !st.notif; save(); if (sheetState) refreshSheet(); if (ui.tab === 'perfil') { const y = $('#view').scrollTop; render(); $('#view').scrollTop = y; } toast(st.notif ? 'Recibirá una sugerencia ligera por día' : 'Sugerencia diaria desactivada', 'bell'); break;
    case 'demonotif': closeSheet(); showBanner(); break;
    case 'notifsheet': sheetNotif(); break;
    case 'replay': onb.step = 0; $('#onb').hidden = false; renderOnb(); break;
    case 'resetask': ui.confirmReset = true; render(); break;
    case 'resetno': ui.confirmReset = false; render(); break;
    case 'resetyes': { ui.confirmReset = false; const d = defaults(); Object.keys(st).forEach(k => delete st[k]); Object.assign(st, d, { onboarded: true }); save(); render(); toast('Datos restablecidos'); break; }
    case 'premium': sheetPremium(); break;
    case 'product': sheetProduct(id); break;
    case 'wantproduct': st.wants[id] = true; save(); refreshSheet(); toast('¡Registrado! Le avisaremos cuando pueda desbloquear.', 'crown'); if (ui.tab === 'premium' && !ui.stack.length) { const y = $('#view').scrollTop; render(); $('#view').scrollTop = y; } break;
    case 'waitlist': st.waitlist = true; save(); refreshSheet(); toast('¡Listo! Le avisaremos en cuanto abra.', 'crown'); if (!ui.stack.length) { const y = $('#view').scrollTop; render(); $('#view').scrollTop = y; } break;
    // onboarding
    case 'onbnext': onb.step++; renderOnb(); $('#onb').scrollTop = 0; break;
    case 'onbprev': onb.step = Math.max(0, onb.step - 1); renderOnb(); break;
    case 'onbskip': onb.step = 4; renderOnb(); break;
    case 'onbgoal': { const n = $('#onbname'); if (n) st.name = n.value; toggleIn(onb.goals, t.dataset.v); renderOnb(); break; }
    case 'onbdone': finishOnb(); break;
  }
}
function runCreate() {
  cr.loading = true; render(); $('#view').scrollTop = 0;
  setTimeout(() => { cr.result = generate(); cr.loading = false; if (ui.tab === 'criar') { render(); $('#view').scrollTop = 0; } }, 1100);
}
function onSubmit(e) {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const k = f.dataset.form;
  if (k === 'cradd') crAddFromInput();
  if (k === 'shopadd') { const v = $('#shopin').value.trim(); if (v) { st.shop.push({ key: 'x:' + norm(v) + Date.now(), name: cap(v), qty: '', sec: 'Otros', from: [], done: false }); save(); refreshTopPage(); setTimeout(() => $('#shopin') && $('#shopin').focus(), 0); } }
  if (k === 'newcoll' || k === 'newcoll-save') {
    const v = $('#ncname').value.trim(); if (!v) { $('#ncname').focus(); return; }
    const c = { id: 'c' + Date.now().toString(36), name: v, items: [] };
    if (k === 'newcoll-save') c.items.push(f.dataset.id);
    st.colls.push(c); save();
    if (k === 'newcoll') { closeSheet(); render(); toast('Colección creada', 'bookmark'); } else { refreshSheet(); toast('Colección creada y receta guardada', 'bookmark'); }
  }
  if (k === 'onbname') finishOnb();
}
function onInput(e) {
  if (e.target.id === 'rq') { ui.rx.q = e.target.value; ui.rx.page = 1; clearTimeout(ui.qt); ui.qt = setTimeout(() => { if (ui.tab !== 'receitas' || ui.stack.length) return; const pos = e.target.selectionStart; render(); const q = $('#rq'); if (!q) return; q.focus(); try { q.setSelectionRange(pos, pos); } catch (_) { } }, 220); }
  if (e.target.id === 'crq') { cr.q = e.target.value; showSugg(); }
  if (e.target.id === 'namein') { st.name = e.target.value; save(); }
  if (e.target.id === 'onbname') { st.name = e.target.value; }
}
function onChange(e) {
  if (e.target.id === 'notiftime') { st.notifTime = e.target.value; save(); toast('Sugerencia a las ' + st.notifTime, 'bell'); }
  if (e.target.id === 'photoin') {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 200; const x = c.getContext('2d'); const s = Math.min(im.width, im.height); x.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 200, 200); st.photo = c.toDataURL('image/jpeg', .85); save(); render(); toast('Foto actualizada', 'camera'); }; im.src = rd.result; };
    rd.readAsDataURL(file);
  }
}
function onKey(e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[tabindex="0"][data-a]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') { if (sheetState) closeSheet(); else if (ui.stack.length) popPage(); }
}

/* ============ ARRANQUE ============ */
function boot() {
  $('#tabbar').innerHTML = [['inicio', 'home', 'Inicio'], ['receitas', 'book', 'Recetas'], ['criar', 'pot', 'Crear receta'], ['favoritos', 'heart', 'Favoritos'], ['premium', 'lock', 'Premium'], ['perfil', 'user', 'Perfil']].map(([k, i, l]) => k === 'criar'
    ? `<button class="mid" data-a="tab" data-tab="${k}"><span class="fab">${ic('sparkle')}</span><span class="l">${l}</span></button>`
    : `<button data-a="tab" data-tab="${k}">${ic(i)}<span>${l}</span><i class="dot"></i></button>`).join('');
  document.addEventListener('click', onClick);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  setTab('inicio');
  if (!st.onboarded) { $('#onb').hidden = false; renderOnb(); }
  else if (st.notif) setTimeout(showBanner, 1800);
}
</script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="wellness.js"></script>
<script>boot();</script>
